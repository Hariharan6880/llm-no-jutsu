name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No install step: the project has zero dependencies and is run from a
      # clone. The live tests skip themselves because no CLI is installed
      # here, and logging a subscription into a CI runner is neither possible
      # nor wise.
      - name: Run tests
        run: python -m unittest discover -s tests -v
